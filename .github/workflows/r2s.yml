# This is a basic workflow to help you get started with Actions

name: test

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Get current date
        run: |
          echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Get packages to be installed
        run: |
          echo "packages=$(cat packages.list)" >> $GITHUB_ENV

      - uses: actions/checkout@v3

      - uses: robinraju/release-downloader@v1.8
        with:
          repository: "jerrykuku/luci-theme-argon"
          latest: true
          fileName: "*.ipk"
          out-file-path: "packages"

      - uses: izer-xyz/openwrt-imagebuilder-action@main
        with:
          image: rockchip-armv8
          profile: friendlyarm_nanopi-r2s
          openwrt-version: 24.10.0
          packages: ${{ env.packages }}
          files: files
          rootfs-size: 100
          #debug: 1
          #disabled-services: dhcp

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: bin/*.img.gz
          tag_name: ${{ env.date }}
          name: '24.10 build ${{ env.date }}'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
