# This is a basic workflow to help you get started with Actions

name: test

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v3

      # - uses: robinraju/release-downloader@v1.8
      #   with:
      #     repository: "izer-xyz/librespot-openwrt"
      #     latest: true
      #     fileName: "*.ipk"
      #     out-file-path: "packages"
       
      - uses: izer-xyz/openwrt-imagebuilder-action@main
        with:
          image: rockchip-armv8
          profile: friendlyarm_nanopi-r2s
          openwrt-version: 24.10.0
          packages: >-
            apcupsd
            base-files
            busybox
            ca-bundle
            collectd-mod-apcups collectd-mod-ping collectd-mod-thermal coreutils-dd
            curl
            dnsmasq
            dropbear
            e2fsprogs
            firewall4
            getrandom
            kmod-crypto-acompress kmod-fs-cifs kmod-gpio-button-hotplug kmod-lib-lzo kmod-ppp kmod-pppoe kmod-usb-hid kmod-usb-net-rtl8152
            libf2fs6 liblucihttp-ucode libsmartcols1 libuclient20201210
            logd logrotate
            losetup
            luci luci-app-attendedsysupgrade luci-app-openvpn luci-app-sqm luci-app-statistics luci-app-watchcat luci-lib-ipkg luci-mod-rpc luci-ssl
            mkf2fs
            mtd
            odhcp6c odhcpd-ipv6only
            openssh-sftp-server
            openvpn-openssl
            parted
            partx-utils
            ppp ppp-mod-pppoe
            procd procd-seccomp procd-ujail
            resize2fs
            tailscale
            uboot-envtools
            uci
            umdns
            urandom-seed
            urngd
            wget-ssl
          files: test/files
          rootfs-size: 64
          #debug: 1
          #disabled-services: dhcp
         # extra-image-name: useless

      # - name: Store packages
      #   uses: actions/upload-artifact@v3
      #   with:
      #     name: armvirt-32
      #     path: bin/*
