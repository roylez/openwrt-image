# This is a basic workflow to help you get started with Actions

name: test

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  OPENWRT_VERSION: 25.12.6

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v3

      - name: Get variables
        run: |
          echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

          PACKAGES="$(cat packages.list |tr '\n' ' ')"
          echo "packages=$PACKAGES" >> $GITHUB_ENV

      - uses: robinraju/release-downloader@v1.13
        with:
          repository: "jerrykuku/luci-theme-argon"
          # latest: true
          tag: v2.3.2
          fileName: "*.?pk"
          out-file-path: "packages"

      - uses: izer-xyz/openwrt-imagebuilder-action@main
        with:
          image: rockchip-armv8
          profile: friendlyarm_nanopi-r2s
          openwrt-version: ${{ env.OPENWRT_VERSION }}
          packages: ${{ env.packages }}
          files: files
          rootfs-size: 100
          #debug: 1
          #disabled-services: dhcp
      - name: Add build date to artifact names
        run: |
          sudo chmod -R a+rw bin
          for f in bin/targets/*/*/*.img.gz; do
            mv "$f" "$(echo "$f" | sed "s/-rockchip/-${date//-/}-rockchip/")"
          done

      - name: Release
        uses: softprops/action-gh-release@v2.3.2
        with:
          files: bin/**/*.img.gz
          tag_name: ${{ env.date }}
          name: '${{ env.OPENWRT_VERSION }} build ${{ env.date }}'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
